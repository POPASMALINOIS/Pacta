<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Pacta</title>

  <link rel="manifest" href="./manifest.json" />
  <link rel="stylesheet" href="./css/styles.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<div id="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark"></span>
      <span>Pacta</span>
    </div>

    <button type="button" id="logoutBtn" class="ghost-btn hidden">
      Salir
    </button>
  </header>

  <main>

    <section id="authView" class="view active">
      <div class="auth-shell">

        <div class="auth-copy">
          <p class="eyebrow">Pacta</p>
          <h1>Gastos compartidos, claros desde el principio.</h1>
          <p class="lead">Crea grupos, añade gastos y salda cuentas en tiempo real.</p>
        </div>

        <div class="auth-panel">

          <div class="auth-tabs">
            <button type="button" id="loginTab" class="tab active">Entrar</button>
            <button type="button" id="registerTab" class="tab">Registro</button>
          </div>

          <form id="authForm">

            <div id="nameField" class="field hidden">
              <label>Nombre</label>
              <input type="text" id="name" autocomplete="name" />
            </div>

            <div class="field">
              <label>Email</label>
              <input type="email" id="email" required autocomplete="email" />
            </div>

            <div class="field">
              <label>Contraseña</label>
              <input type="password" id="password" required autocomplete="current-password" />
            </div>

            <button type="submit" class="primary-btn">Continuar</button>

          </form>

        </div>

      </div>
    </section>

    <section id="homeView" class="view">

      <div class="screen-head">
        <div>
          <p class="eyebrow">Tus grupos</p>
          <h2 id="welcomeText">Pacta</h2>
        </div>

        <button type="button" id="newGroupBtn" class="primary-btn compact">
          Nuevo grupo
        </button>
      </div>

      <div id="groupsList" class="list"></div>

    </section>

    <section id="createGroupView" class="view">

      <div class="screen-head">
        <div>
          <p class="eyebrow">Nuevo grupo</p>
          <h2>Crear grupo</h2>
        </div>
      </div>

      <form id="groupForm" class="form-block">

        <div class="field">
          <label>Nombre del grupo</label>
          <input type="text" id="groupName" placeholder="Viaje a Asturias" required />
        </div>

        <button type="submit" class="primary-btn">Crear grupo</button>

        <button type="button" class="link-btn" data-go-home>
          Cancelar
        </button>

      </form>

    </section>

    <section id="groupView" class="view">

      <div class="screen-head">
        <div>
          <p class="eyebrow">Grupo</p>
          <h2 id="groupTitle">Grupo</h2>
        </div>

        <button type="button" id="addExpenseBtn" class="primary-btn compact">
          Nuevo gasto
        </button>
      </div>

      <div id="groupBalance" class="summary-strip"></div>

      <section class="panel">
        <div class="panel-head">
          <div>
            <p class="eyebrow">Participantes</p>
            <h3>Miembros</h3>
          </div>
        </div>

        <form id="memberForm" class="inline-form">
          <input type="email" id="memberEmail" placeholder="email del participante" />
          <button type="submit">Añadir</button>
        </form>

        <div id="membersList" class="members-list"></div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <div>
            <p class="eyebrow">Gastos</p>
            <h3>Últimos movimientos</h3>
          </div>
        </div>

        <div id="expensesList" class="list"></div>
      </section>

    </section>

    <section id="expenseView" class="view">

      <div class="screen-head">
        <div>
          <p class="eyebrow">Nuevo gasto</p>
          <h2>Añadir gasto</h2>
        </div>
      </div>

      <form id="expenseForm" class="form-block">

        <div class="field">
          <label>Descripción</label>
          <input type="text" id="expenseDescription" required />
        </div>

        <div class="field">
          <label>Importe</label>
          <input type="number" step="0.01" id="expenseAmount" required />
        </div>

        <div class="field">
          <label>Fecha</label>
          <input type="date" id="expenseDate" required />
        </div>

        <div class="field">
          <label>Participantes incluidos</label>
          <div id="expenseParticipants" class="check-list"></div>
        </div>

        <button type="submit" class="primary-btn">Guardar gasto</button>

        <button type="button" class="link-btn" id="cancelExpenseBtn">
          Cancelar
        </button>

      </form>

    </section>

  </main>

  <nav id="bottomNav" class="bottom-nav hidden">
    <button type="button" data-nav="home" class="active">Inicio</button>
    <button type="button" data-nav="group">Grupo</button>
    <button type="button" data-nav="balances">Saldos</button>
  </nav>

</div>

<script type="module" src="./js/app.js"></script>

</body>
</html>
